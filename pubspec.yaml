name: factorino
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Persian localization and RTL. Every user-facing string goes
  # through the generated AppStrings from day one; there is no second locale
  # yet and the layer exists anyway, because retrofitting one is a rewrite of
  # every widget.
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Encryption key storage (Android Keystore / Windows DPAPI). Added first,
  # ahead of any application code, as the probe for whether a plugin pulling
  # new AndroidX artifacts can resolve on this machine (DECISIONS.md D-014).
  flutter_secure_storage: 11.0.0

  # Persistence (DECISIONS.md D-008). Drift talks to `package:sqlite3`, which
  # since 3.x builds and bundles the native library through Dart build hooks --
  # see the `hooks:` block at the bottom of this file and D-010.
  drift: 2.34.3
  sqlite3: 3.5.2

  # UUID v4 primary keys (D-001). A hand-rolled generator was written and then
  # reversed by the project owner (D-024): the keys this produces are the
  # identity of every synced record, and a subtle generator bug there is both
  # rare and expensive to diagnose.
  uuid: 4.6.0

  # Resolves the per-user application-support directory the database lives in
  # (%APPDATA% on Windows, app-private storage on Android) -- the project spec.
  path_provider: 2.1.5

  # State management and dependency injection (DECISIONS.md D-007), in the
  # code-generation flavor. The repository providers are the seam that lets a
  # test swap the whole data layer for an in-memory one without a widget
  # knowing.
  #
  # If it becomes unmaintained: provider boundaries are ordinary Dart classes,
  # so a migration would be mechanical but wide. Accepted given its maturity.
  flutter_riverpod: 3.4.2
  riverpod_annotation: 4.0.6

  # Routing (DECISIONS.md D-009). Chosen for real, shareable URLs on the web
  # and working deep links on Windows and Android -- both stated product
  # requirements that Navigator 1.0 cannot meet.
  #
  # If it becomes unmaintained: routes are declared in one file behind our own
  # destination list, so the surface to port is small and mechanical.
  go_router: 17.5.0

  # Jalali (Shamsi) calendar conversion (D-005/D-006). Dates are
  # stored as UTC epoch milliseconds and displayed Jalali, and reporting periods
  # are Jalali months and years -- so the conversion is on the correctness path
  # for every dashboard figure, not just for formatting.
  #
  # If it becomes unmaintained: the Jalali<->Gregorian algorithm is a fixed,
  # published arithmetic (Birashk / Borkowski) over a calendar whose leap rule
  # does not change, and `core/date/` wraps it behind our own types -- so a
  # replacement is a single-file swap, checked by the existing boundary tests.
  shamsi_date: 1.1.1
  file_selector: 1.1.0
  flutter_file_dialog: 3.3.2

  # PDF generation (Phase 7, D-070 and D-073). Builds the page model and writes
  # the file in pure Dart -- no platform renderer, so one implementation serves
  # Android, Windows and Web, which is why it beat the alternatives for a
  # three-platform target.
  #
  # It was measured before it was chosen, not after (D-070): a throwaway probe
  # rendered real invoice pages and the pixels were read, because the risk here
  # is not "does it produce a PDF" but "does it shape Persian correctly", and
  # nothing about that is answerable from documentation. It shapes and joins
  # Persian, lays RTL out, renders Persian digits and the Arabic thousands
  # separator, and places a Latin invoice number correctly inside an RTL
  # sentence. The size and startup cost it adds is recorded in D-074 against
  # the entry-gate baseline taken on `60b5cd5`.
  #
  # Two faults in it are known, characterised, and worked around here rather
  # than reported-and-waited-on. Both are recorded because a future reader will
  # otherwise remove the workaround as unexplained:
  #   * `TtfParser.readGlyph` does not check whether a glyph is empty, so any
  #     zero-length glyph draws the NEXT glyph in the font (D-073). Guarded by
  #     `core/pdf/font_glyph_safety.dart`, which derives the unsafe set from the
  #     bundled font rather than listing characters.
  #   * U+2068/U+2069 are absent from Vazirmatn and the shaper drops the last
  #     character of a run containing them (D-070 finding 1). Stripped at the
  #     view-model boundary.
  #
  # If it becomes unmaintained: the page model is built behind
  # `InvoiceDocumentGenerator`, which takes an already-computed view model and
  # computes nothing, so the surface to port is one implementation class. The
  # two workarounds above are ours and move with it.
  pdf: 3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drift table/DAO code generation. Kept out of the runtime dependency set --
  # nothing generated needs the generator at run time.
  drift_dev: 2.34.5
  build_runner: 2.16.0

  # Generates the provider boilerplate for the annotations above. Note that
  # `riverpod_lint`/`custom_lint` are deliberately NOT here: they pin the
  # analyzer back far enough to drag drift and sqlite3 down with them, which
  # would reintroduce the end-of-life native packages D-010 exists to avoid
  # (D-015).
  riverpod_generator: 4.0.8

  # Runs the D-020 encryption proof on a real Android device and on Windows.
  # A Dart-VM test cannot stand in for it: the proof is precisely about whether
  # the native library is found through Flutter's packaging path at runtime.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates AppStrings from the ARB files. See l10n.yaml.
  generate: true

  fonts:
    # Vazirmatn (SIL OFL), standard variant, from the official GitHub release
    # v33.003 -- provenance and sha256 in docs/ENVIRONMENT.md (D-022).
    #
    # The Farsi-digit (FD) variants are deliberately NOT used: digit rendering
    # is `core/formatting/`'s job, where it is reviewable and testable, not a
    # substitution hidden inside a binary asset.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Build-hook configuration for `package:sqlite3` (DECISIONS.md D-010).
# `sqlite3mc` = SQLite3 Multiple Ciphers: the encryption-at-rest provider for
# Android and Windows. The cipher is configured SQLCipher-compatible at
# connection-open time, not here -- see D-020.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
